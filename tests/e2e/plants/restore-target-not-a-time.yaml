# A target that is not a time is refused at apply, not after a restore.
# expect: The format of TargetTime is invalid
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: plant-restore-target-not-a-time
  namespace: database
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:c9be7f221a05b18fe65259d9136affbabe3b39ad91c3b68f8f2f990a45f35f38
  bootstrap:
    recovery:
      source: origin
      recoveryTarget:
        targetTime: "yesterday"
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: backups
          serverName: pg
  storage:
    size: 1Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}
