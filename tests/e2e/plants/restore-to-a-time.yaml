# The control: a well-formed restore to a time, with its zone. It has to be
# admitted, or every refusal below could be the operator refusing everything.
# expect: admitted
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: plant-restore-to-a-time
  namespace: database
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:c9be7f221a05b18fe65259d9136affbabe3b39ad91c3b68f8f2f990a45f35f38
  bootstrap:
    recovery:
      source: origin
      recoveryTarget:
        targetTime: "2026-10-14 16:50:01.000000+00"
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: backups
          serverName: pg
  storage:
    size: 1Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}
